name: Build Pearity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # required to create/update releases

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version
        id: version
        run: |
          N=${{ github.run_number }}

          # Convert run number to a spelled ordinal word (1→one, 21→twenty-one, etc.)
          ONES=("" one two three four five six seven eight nine \
                ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen)
          TENS=("" "" twenty thirty forty fifty sixty seventy eighty ninety)

          if [ "$N" -lt 20 ]; then
            ORDINAL="${ONES[$N]}"
          else
            T=$(( N / 10 ))
            O=$(( N % 10 ))
            if [ "$O" -eq 0 ]; then
              ORDINAL="${TENS[$T]}"
            else
              ORDINAL="${TENS[$T]}-${ONES[$O]}"
            fi
          fi

          VERSION_NAME="1.0.0-alpha.${ORDINAL}"
          APK_NAME="pearity-${VERSION_NAME}.apk"
          TAG="v${VERSION_NAME}"

          echo "ordinal=${ORDINAL}"         >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${N}"          >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}"       >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"                 >> "$GITHUB_OUTPUT"

          echo "Version: ${VERSION_NAME} (code ${N})"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Without this, AGP mints a fresh random debug keystore on every ephemeral
      # runner, so consecutive releases carry different signatures and users hit
      # "signature mismatch" on every update, forcing uninstall + data loss.
      - name: Restore persistent debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.PEARITY_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            echo "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "Persistent debug keystore installed"
          else
            echo "No keystore secret set; falling back to runner-generated debug keystore"
          fi

      # Catches the exact failure mode that broke every release before the persistent keystore
      # was introduced: a corrupted/regenerated secret would silently produce a differently
      # signed APK, and users would only find out when their next update refused to install.
      - name: Verify keystore fingerprint
        env:
          KEYSTORE_B64: ${{ secrets.PEARITY_DEBUG_KEYSTORE_B64 }}
          EXPECTED_SHA256: "9A:76:42:6F:D8:8E:95:D9:89:25:51:C3:9B:10:E6:14:B6:58:52:FE:BD:88:5E:0C:B0:E7:0B:25:64:6B:E4:79"
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No keystore secret set; skipping fingerprint check (build already using a runner-generated keystore)"
            exit 0
          fi
          ACTUAL_SHA256=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey \
            | grep "SHA256:" | head -1 | sed 's/.*SHA256: //')
          echo "Expected: $EXPECTED_SHA256"
          echo "Actual:   $ACTUAL_SHA256"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Keystore fingerprint mismatch — PEARITY_DEBUG_KEYSTORE_B64 does not match the expected signing cert. Publishing would break updates for existing users."
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        continue-on-error: true  # Ignore cache service failures
        with:
          gradle-version: '8.10.2'
          cache-disabled: false
          cache-read-only: ${{ github.event_name != 'push' }}
          gradle-home-cache-cleanup: true

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --no-configuration-cache

      - name: Build debug APK
        run: |
          gradle assembleDebug \
            -PversionName=${{ steps.version.outputs.version_name }} \
            -PversionCode=${{ steps.version.outputs.version_code }} \
            --no-daemon --no-configuration-cache

      # AGP's built-in Android Lint — no extra tooling/config needed. Catches Android-specific
      # issues unit tests can't (manifest problems, invalid resource refs, deprecated API usage).
      # Only fails the build on lint-error severity, not warnings.
      - name: Run Android Lint
        run: gradle lintDebug --no-daemon --no-configuration-cache

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-debug.html
          retention-days: 30
          if-no-files-found: ignore

      # Only the debug APK ships (see "Publish to GitHub Releases" below); this build is a
      # smoke test only, unsigned and discarded. It exists because minification (isMinifyEnabled
      # = true, release-only) is never otherwise exercised — the debug build always skips R8, so a
      # reflection/serialization keep-rule gap or a shrinker-only failure would ship silently
      # without ever failing CI.
      - name: Build release APK (R8 smoke test, not published)
        run: |
          gradle assembleRelease \
            -PversionName=${{ steps.version.outputs.version_name }} \
            -PversionCode=${{ steps.version.outputs.version_code }} \
            --no-daemon --no-configuration-cache

      - name: Locate and rename APK
        run: |
          # find the produced APK regardless of exact sub-path
          SRC=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "Found APK: ${SRC}"
          cp "${SRC}" "${{ steps.version.outputs.apk_name }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pearity-${{ steps.version.outputs.version_name }}-${{ github.sha }}
          path: ${{ steps.version.outputs.apk_name }}
          retention-days: 30

      - name: Publish to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Pearity ${{ steps.version.outputs.version_name }}
          prerelease: true
          body: |
            ## Pearity ${{ steps.version.outputs.version_name }}

            > **Alpha software** — settings are read/written via Shizuku or root.
            > Not all settings may apply on every device. Samsung One UI is the primary target.

            **Build:** `${{ github.sha }}` · run #${{ github.run_number }}

            ### Requirements
            - Android 12+ (API 31)
            - [Shizuku](https://github.com/RikkaApps/Shizuku) running **or** a rooted device

            ### Install
            1. Download the `.apk` file below
            2. Enable *Install unknown apps* in your file manager / browser settings
            3. Install and launch Pearity
          files: ${{ steps.version.outputs.apk_name }}
